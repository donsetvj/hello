<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow, noarchive">
<title>Editor — Hello</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/theme/material-darker.min.css">
<style>
:root{color-scheme:dark;--bg:#090d16;--panel:#111a2a;--line:#27344c;--muted:#9aabc9;--text:#f3f7ff;--mint:#83e3d0;--blue:#8aa9ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#1a2a4a 0,#0d1422 44%,var(--bg) 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}
.topbar{height:72px;border-bottom:1px solid rgba(145,169,211,.16);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,56px);background:rgba(8,13,23,.58);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.02em}
.brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(135deg,#83e3d0,#7ca0ff);color:#091320;font-weight:900;font-size:17px}
.back{font-size:13px;color:#c5d1e9;border:1px solid var(--line);padding:9px 13px;border-radius:10px;transition:.2s}
.back:hover{border-color:#7890bd;color:#fff}
main{max-width:1480px;margin:0 auto;padding:34px clamp(16px,3vw,42px) 48px}
.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:23px}
.eyebrow{color:var(--mint);font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;margin:0 0 10px}
h1{font-size:clamp(30px,4vw,43px);letter-spacing:-.055em;line-height:1.05;margin:0}
.description{color:var(--muted);font-size:14px;line-height:1.65;margin:12px 0 0;max-width:650px}
.shortcut{color:#9caccc;font-size:12px;white-space:nowrap;margin-bottom:4px}
kbd{font:inherit;font-size:11px;padding:4px 7px;border:1px solid #34415a;border-radius:6px;background:#151f31;color:#e0e8fa}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:stretch}
.panel{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(14,22,36,.9);box-shadow:0 18px 48px rgba(0,0,0,.18);min-width:0}
.panel-head{height:55px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(20,31,49,.8)}
.panel-title{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:750}
.window-dots{display:flex;gap:5px}.window-dots i{width:7px;height:7px;border-radius:50%;background:#43516c}.window-dots i:first-child{background:#f38c91}.window-dots i:nth-child(2){background:#e9c46a}.window-dots i:nth-child(3){background:#7edbb8}
.panel-actions{display:flex;align-items:center;gap:8px}
.btn{appearance:none;border:1px solid #33415c;color:#d9e3f7;background:#151f32;font:inherit;font-size:12px;font-weight:750;padding:10px 13px;border-radius:9px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.btn:hover{border-color:#657da8;transform:translateY(-1px)}
.btn:focus-visible,.tab:focus-visible,a:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.btn-run{background:var(--mint);border-color:var(--mint);color:#081521;padding:10px 17px;box-shadow:0 5px 18px rgba(131,227,208,.13)}
.btn-run:hover{background:#a0f2e2;border-color:#a0f2e2}
.tabs{height:48px;display:flex;align-items:stretch;gap:4px;padding:0 12px;border-bottom:1px solid var(--line);background:#0f1726}
.tab{position:relative;appearance:none;border:0;background:transparent;color:#8fa0c0;font:inherit;font-size:12px;font-weight:750;padding:0 15px;cursor:pointer}
.tab[aria-selected="true"]{color:#f5f8ff}
.tab[aria-selected="true"]::after{content:"";position:absolute;bottom:-1px;left:10px;right:10px;height:2px;border-radius:2px;background:var(--mint)}
.lang-dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:7px;background:#ed9e70}.tab[data-tab="css"] .lang-dot{background:#82a7ff}.tab[data-tab="js"] .lang-dot{background:#e9c46a}
.editor-wrap{height:420px;background:#101722}
.editor-pane{display:none;height:100%}.editor-pane.active{display:block}
.editor-pane textarea{width:100%;height:100%;resize:none;border:0;outline:0;padding:17px;background:#101722;color:#eaf0ff;font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;tab-size:2}
.CodeMirror{height:100%;font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;padding-top:8px;background:#101722;color:#eaf0ff}
.CodeMirror-gutters{background:#101722;border-right:1px solid #263145}
.cm-s-material-darker .CodeMirror-gutters{background:#101722}
.cm-s-material-darker .CodeMirror-linenumber{color:#53617b}
.editor-footer{height:41px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#8292b0;font-size:11px;background:#101722}
.status{display:flex;align-items:center;gap:7px}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--mint)}
.preview-body{padding:12px;background:#0b111d}
.preview-frame{display:block;width:100%;height:509px;border:1px solid #dbe1eb;border-radius:9px;background:white}
.preview-note{font-size:11px;color:#8292b0;display:flex;justify-content:space-between;gap:12px;padding:10px 3px 0}
.footer-note{margin-top:20px;color:#7788a7;font-size:12px;line-height:1.7}
.footer-note strong{color:#b6c5e2;font-weight:650}
@media(max-width:900px){.workspace{grid-template-columns:1fr}.editor-wrap{height:360px}.preview-frame{height:440px}.intro{align-items:flex-start;flex-direction:column;gap:10px}.shortcut{margin:0}}
@media(max-width:480px){.topbar{height:62px;padding:0 15px}.back{font-size:12px;padding:8px 10px}main{padding-top:25px}.panel-head{padding:0 10px}.panel-actions{gap:5px}.btn{padding:9px 10px}.btn-run{padding:9px 12px}.tab{padding:0 11px}.editor-wrap{height:320px}.preview-frame{height:380px}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./" aria-label="回到 Hello 首頁"><span class="brand-mark">H</span><span>Hello <span style="color:#83e3d0">/</span> Editor</span></a>
  <a class="back" href="./">← 回到首頁</a>
</header>
<main>
  <div class="intro">
    <div>
      <p class="eyebrow">Playground · HTML / CSS / JS</p>
      <h1>把想法，直接跑出來。</h1>
      <p class="description">編輯程式碼，按下 RUN 即可預覽。支援 HTML、CSS、JavaScript 語法上色，也能將三者打包下載成單一 HTML 檔案。</p>
    </div>
    <div class="shortcut">快速執行 <kbd>Ctrl</kbd> + <kbd>Enter</kbd></div>
  </div>

  <section class="workspace" aria-label="程式碼編輯與預覽">
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title"><span class="window-dots" aria-hidden="true"><i></i><i></i><i></i></span> 程式碼編輯器</div>
        <div class="panel-actions">
          <button class="btn" id="resetBtn" type="button">↺ Reset</button>
          <button class="btn btn-run" id="runBtn" type="button">▶ RUN</button>
        </div>
      </div>
      <div class="tabs" role="tablist" aria-label="程式語言">
        <button class="tab" type="button" role="tab" data-tab="html" aria-selected="true"><span class="lang-dot"></span>HTML</button>
        <button class="tab" type="button" role="tab" data-tab="css" aria-selected="false"><span class="lang-dot"></span>CSS</button>
        <button class="tab" type="button" role="tab" data-tab="js" aria-selected="false"><span class="lang-dot"></span>JavaScript</button>
      </div>
      <div class="editor-wrap">
        <div class="editor-pane active" data-pane="html"><textarea id="htmlCode" spellcheck="false" aria-label="HTML 程式碼"><main class="card">
  <p class="eyebrow">YOUR FIRST EXPERIMENT</p>
  <h1>Hello, <span>world!</span></h1>
  <p class="message">Edit the code and make it yours.</p>
  <button id="helloButton">Click me</button>
  <p id="result" aria-live="polite"></p>
</main></textarea></div>
        <div class="editor-pane" data-pane="css"><textarea id="cssCode" spellcheck="false" aria-label="CSS 程式碼">body {
  margin: 0;
  padding: 36px;
  font-family: system-ui, sans-serif;
  color: #17233b;
  background: #f4f7fb;
}
.card { max-width: 560px; margin: 30px auto; }
.eyebrow { color: #64748b; font-size: 12px; letter-spacing: .16em; }
h1 { font-size: clamp(38px, 8vw, 64px); letter-spacing: -.05em; }
h1 span { color: #188f80; }
.message { color: #64748b; }
button {
  padding: 11px 16px; border: 0; border-radius: 9px;
  background: #17233b; color: white; cursor: pointer;
}
button:hover { background: #188f80; }
</textarea></div>
        <div class="editor-pane" data-pane="js"><textarea id="jsCode" spellcheck="false" aria-label="JavaScript 程式碼">const button = document.querySelector("#helloButton");
const result = document.querySelector("#result");

button.addEventListener("click", () => {
  result.textContent = "It works! ✨";
});
</textarea></div>
      </div>
      <div class="editor-footer"><span class="status"><span class="status-dot"></span><span id="editorStatus">Ready</span></span><span id="lineStatus">HTML · Line 1, Col 1</span></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title"><span style="color:#83e3d0">◉</span> 預覽結果</div>
        <div class="panel-actions"><button class="btn" id="downloadBtn" type="button">↓ 下載 .html</button></div>
      </div>
      <div class="preview-body">
        <iframe class="preview-frame" id="previewFrame" title="執行結果預覽" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
        <div class="preview-note"><span id="previewStatus">預覽尚未更新</span><span>Sandboxed preview</span></div>
      </div>
    </div>
  </section>
  <p class="footer-note"><strong>小提醒：</strong>請只執行你信任的程式碼。預覽在隔離的視窗中執行；外部字型、圖片或套件等資源仍需要網路連線。</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/mode/htmlmixed/htmlmixed.min.js"></script>
<script>
(function () {
  "use strict";
  const starters = {
    html: document.getElementById("htmlCode").value,
    css: document.getElementById("cssCode").value,
    js: document.getElementById("jsCode").value
  };
  const modeByKey = { html: "htmlmixed", css: "css", js: "javascript" };
  const editors = {};
  const textareas = {
    html: document.getElementById("htmlCode"),
    css: document.getElementById("cssCode"),
    js: document.getElementById("jsCode")
  };
  const editorStatus = document.getElementById("editorStatus");
  const lineStatus = document.getElementById("lineStatus");
  const previewStatus = document.getElementById("previewStatus");
  const previewFrame = document.getElementById("previewFrame");

  Object.keys(textareas).forEach(function (key) {
    const textarea = textareas[key];
    if (window.CodeMirror) {
      editors[key] = CodeMirror.fromTextArea(textarea, {
        mode: modeByKey[key],
        theme: "material-darker",
        lineNumbers: true,
        indentUnit: 2,
        tabSize: 2,
        indentWithTabs: false,
        lineWrapping: false,
        viewportMargin: 30,
        extraKeys: { "Ctrl-Enter": runCode, "Cmd-Enter": runCode }
      });
      editors[key].on("change", function () {
        editorStatus.textContent = "Unsaved edits";
        updateLineStatus(key);
      });
      editors[key].on("cursorActivity", function () { updateLineStatus(key); });
    } else {
      textarea.addEventListener("input", function () {
        editorStatus.textContent = "Unsaved edits";
        updateLineStatus(key);
      });
      textarea.addEventListener("keyup", function () { updateLineStatus(key); });
    }
  });

  function getValue(key) {
    return editors[key] ? editors[key].getValue() : textareas[key].value;
  }
  function setValue(key, value) {
    if (editors[key]) editors[key].setValue(value);
    else textareas[key].value = value;
  }
  function updateLineStatus(key) {
    const editor = editors[key];
    if (editor) {
      const cursor = editor.getCursor();
      lineStatus.textContent = key.toUpperCase() + " · Line " + (cursor.line + 1) + ", Col " + (cursor.ch + 1);
    } else {
      const text = textareas[key];
      const before = text.value.slice(0, text.selectionStart);
      const lines = before.split("\n");
      lineStatus.textContent = key.toUpperCase() + " · Line " + lines.length + ", Col " + (lines[lines.length - 1].length + 1);
    }
  }
  function activateTab(key) {
    document.querySelectorAll(".tab").forEach(function (tab) {
      const active = tab.dataset.tab === key;
      tab.setAttribute("aria-selected", String(active));
      tab.tabIndex = active ? 0 : -1;
    });
    document.querySelectorAll(".editor-pane").forEach(function (pane) {
      pane.classList.toggle("active", pane.dataset.pane === key);
    });
    if (editors[key]) {
      editors[key].refresh();
      editors[key].focus();
    } else textareas[key].focus();
    updateLineStatus(key);
  }
  document.querySelectorAll(".tab").forEach(function (tab) {
    tab.addEventListener("click", function () { activateTab(tab.dataset.tab); });
  });

  function safeInlineContent(text, closingTag) {
    const pattern = new RegExp("</" + closingTag, "gi");
    return text.replace(pattern, "<\\/" + closingTag);
  }
  function makeDocument() {
    const html = getValue("html");
    const css = safeInlineContent(getValue("css"), "style");
    const js = safeInlineContent(getValue("js"), "script");
    const styleTag = css.trim() ? "<style>\n" + css + "\n</style>\n" : "";
    const scriptTag = js.trim() ? "<script>\n" + js + "\n<" + "/script>\n" : "";
    if (/<html[\s>]/i.test(html) || /<!doctype\s+html/i.test(html)) {
      let doc = html;
      if (styleTag) {
        if (/<\/head\s*>/i.test(doc)) doc = doc.replace(/<\/head\s*>/i, styleTag + "</head>");
        else if (/<body[\s>]/i.test(doc)) doc = doc.replace(/<body[\s>]/i, styleTag + "$&");
        else doc = doc.replace(/<html[\s>]/i, "$&\n<head>\n" + styleTag + "</head>");
      }
      if (scriptTag) {
        if (/<\/body\s*>/i.test(doc)) doc = doc.replace(/<\/body\s*>/i, scriptTag + "</body>");
        else doc += "\n" + scriptTag;
      }
      return doc;
    }
    return "<!doctype html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n" + styleTag + "</head>\n<body>\n" + html + "\n" + scriptTag + "</body>\n</html>";
  }

  function runCode() {
    previewFrame.srcdoc = makeDocument();
    editorStatus.textContent = "Run complete";
    previewStatus.textContent = "已更新預覽 · " + new Date().toLocaleTimeString();
  }
  document.getElementById("runBtn").addEventListener("click", runCode);
  document.getElementById("resetBtn").addEventListener("click", function () {
    Object.keys(starters).forEach(function (key) { setValue(key, starters[key]); });
    activateTab("html");
    runCode();
    editorStatus.textContent = "Reset complete";
  });
  document.getElementById("downloadBtn").addEventListener("click", function () {
    const blob = new Blob([makeDocument()], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "hello-editor.html";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    editorStatus.textContent = "HTML downloaded";
  });
  activateTab("html");
  runCode();
})();
</script>
</body>
</html>
