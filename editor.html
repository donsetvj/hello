<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow, noarchive">
<title>Editor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/theme/eclipse.min.css">
<style>
:root{color-scheme:light;--bg:#f4f6fa;--panel:#fff;--line:#dce2ec;--text:#202939;--muted:#778196;--accent:#176b5b;--accent-hover:#0e594b;--editor-bg:#fff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:760;letter-spacing:.01em}
.brand-mark{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:#e2f4ef;color:var(--accent);font-weight:900;font-size:14px}
.actions{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:7px 12px;border:1px solid #d4dce8;border-radius:8px;background:#fff;color:#354155;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:#f5f7fb;border-color:#aebbd0}
.btn:focus-visible,.splitter:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
.btn-run{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-run:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
main{height:calc(100% - 58px);padding:12px;min-height:0}
.workspace{display:grid;grid-template-columns:minmax(260px,1fr) 8px minmax(280px,1fr);gap:0;width:100%;height:100%;min-height:0}
.panel{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 7px rgba(31,48,75,.035)}
.panel-head{height:43px;min-height:43px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:#fff}
.file-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:750;color:#3f4a5d;min-width:0}
.file-icon{width:15px;height:17px;border:1.5px solid #5e8ecb;border-radius:3px;display:inline-block;position:relative;background:#edf4ff}
.file-icon:after{content:"";position:absolute;left:3px;right:3px;top:5px;height:1px;background:#5e8ecb;box-shadow:0 3px #5e8ecb}
.panel-head-right{display:flex;align-items:center;gap:9px;min-width:0}
.preview-size{font-size:11px;font-variant-numeric:tabular-nums;color:#69768a;white-space:nowrap}
.editor-wrap{flex:1;min-height:0;overflow:hidden;background:var(--editor-bg)}
.CodeMirror{height:100%;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;background:#fff;color:#222b38;padding-top:8px}.CodeMirror-scroll{overflow-x:hidden!important;overflow-y:auto!important}.CodeMirror-sizer{min-width:0!important}.CodeMirror-lines{overflow-wrap:anywhere;word-break:normal}
.CodeMirror-gutters{background:#f8faff;border-right:1px solid #e7ebf2}
.CodeMirror-linenumber{color:#a0a8b7;padding:0 8px 0 6px}
.CodeMirror-cursor{border-left:1.5px solid #1d4ed8}
.CodeMirror-selected{background:#dceaff!important}
.cm-s-eclipse .cm-keyword{color:#7c3aed}
.cm-s-eclipse .cm-atom{color:#b45309}
.cm-s-eclipse .cm-number{color:#b45309}
.cm-s-eclipse .cm-def{color:#075eaf}
.cm-s-eclipse .cm-variable{color:#273444}
.cm-s-eclipse .cm-variable-2{color:#0f766e}
.cm-s-eclipse .cm-property{color:#075eaf}
.cm-s-eclipse .cm-operator{color:#536178}
.cm-s-eclipse .cm-string{color:#16803c}
.cm-s-eclipse .cm-comment{color:#8993a4;font-style:italic}
.cm-s-eclipse .cm-tag{color:#c24164}
.cm-s-eclipse .cm-attribute{color:#9a4b11}
.cm-s-eclipse .cm-builtin{color:#7c3aed}
.preview-wrap{position:relative;flex:1;min-height:0;overflow:hidden;background:#fff}
.preview-frame{display:block;width:100%;height:100%;border:0;background:#fff}
.splitter{position:relative;display:flex;align-items:center;justify-content:center;min-width:8px;cursor:col-resize;touch-action:none;outline:none}
.splitter:before{content:"";width:2px;height:100%;max-height:68px;border-radius:2px;background:#c5cdda;transition:background .15s,width .15s}
.splitter:hover:before,.splitter:focus-visible:before,.splitter.dragging:before{width:3px;background:#458b7c}
.splitter:after{content:"";position:absolute;inset:0 -5px;z-index:2}
.statusbar{height:27px;min-height:27px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;background:#fafbfd;border-top:1px solid #e9edf3;font-size:10px;color:#8a94a5}
.status-left{display:flex;align-items:center;gap:7px;min-width:0}
.status-dot{width:6px;height:6px;border-radius:50%;background:#2e9e75;flex-shrink:0}
.status-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:760px){
 html,body{height:auto;min-height:100%;overflow:auto}
 main{height:auto;padding:9px}
 .workspace{height:auto;min-height:0;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(340px,55vh) 8px minmax(380px,65vh);row-gap:0}
 #editorPanel{grid-column:1;grid-row:1}
 #previewPanel{grid-column:1;grid-row:3}
 .splitter{grid-column:1;grid-row:2;cursor:row-resize;min-height:8px;min-width:0}
 .splitter:before{width:68px;height:2px;max-height:none;max-width:none}
 .splitter:hover:before,.splitter:focus-visible:before,.splitter.dragging:before{width:78px;height:3px}
 .topbar{padding:0 12px}
 .brand{font-size:13px}
 .btn{padding:7px 9px;font-size:11px}
}
@media(max-width:390px){
 .topbar{padding:0 8px;gap:6px}
 .actions{gap:5px}
 .btn{padding:7px 7px;font-size:10px}
 main{padding:7px}
 .panel-head{padding:0 9px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">H</span><span>Editor</span></div>
  <div class="actions">
    <button class="btn" id="resetBtn" type="button" title="Reset code">↺ Reset</button>
    <button class="btn btn-run" id="runBtn" type="button" title="Run code">▶ RUN</button>
    <button class="btn" id="downloadBtn" type="button" title="Download HTML file">↓ Download .html</button>
  </div>
</header>
<main>
  <section class="workspace" id="workspace" aria-label="HTML editor and responsive preview">
    <div class="panel" id="editorPanel">
      <div class="panel-head">
        <div class="file-title"><span class="file-icon" aria-hidden="true"></span><span>index.html</span></div>
      </div>
      <div class="editor-wrap"><textarea id="code" spellcheck="false" aria-label="HTML source code"><!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Page</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f3f6fb;
      color: #1b2840;
      font-family: system-ui, sans-serif;
    }
    .card {
      width: min(100%, 520px);
      padding: 32px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 18px 60px #1d355714;
    }
    .eyebrow { color: #16816f; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
    h1 { font-size: clamp(32px, 7vw, 56px); letter-spacing: -.05em; line-height: 1.05; }
    p { color: #64748b; line-height: 1.7; }
    button { border: 0; border-radius: 10px; padding: 12px 16px; background: #176b5b; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">HTML · CSS · JS</div>
    <h1>Hello, world.</h1>
    <p>Edit this page, then press RUN. Resize the preview to test responsive layouts.</p>
    <button id="demoButton">Click me</button>
    <p id="message"></p>
  </main>
  <script>
    const button = document.querySelector("#demoButton");
    const message = document.querySelector("#message");
    button.addEventListener("click", () => {
      message.textContent = "It works! ✨";
    });
  </script>
</body>
</html></textarea></div>
      <div class="statusbar"><span class="status-left"><span class="status-dot"></span><span class="status-text" id="editorStatus">Ready</span></span><span id="cursorStatus">Line 1, Col 1</span></div>
    </div>
    <div class="splitter" id="splitter" role="separator" aria-label="Resize editor and preview panels" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75" aria-valuenow="50" tabindex="0"></div>
    <div class="panel" id="previewPanel">
      <div class="panel-head">
        <div class="file-title"><span>Preview</span></div>
        <div class="panel-head-right"><span class="preview-size" id="previewSize">Responsive · -- × --</span></div>
      </div>
      <div class="preview-wrap" id="previewWrap"><iframe class="preview-frame" id="previewFrame" title="HTML preview" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe></div>
      <div class="statusbar"><span class="status-left"><span class="status-dot"></span><span class="status-text" id="previewStatus">Preview ready</span></span><span>Live viewport</span></div>
    </div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/mode/htmlmixed/htmlmixed.min.js"></script>
<script>
(function () {
  "use strict";
  const starter = document.getElementById("code").value;
  const textarea = document.getElementById("code");
  const workspace = document.getElementById("workspace");
  const splitter = document.getElementById("splitter");
  const editorPanel = document.getElementById("editorPanel");
  const previewPanel = document.getElementById("previewPanel");
  const previewWrap = document.getElementById("previewWrap");
  const previewFrame = document.getElementById("previewFrame");
  const previewSize = document.getElementById("previewSize");
  const editorStatus = document.getElementById("editorStatus");
  const cursorStatus = document.getElementById("cursorStatus");
  const previewStatus = document.getElementById("previewStatus");
  let editor = null;
  let lastDesktopLeft = 0;
  let lastMobileTop = 0;
  let dragging = false;
  let dragAxis = "x";

  if (window.CodeMirror) {
    editor = CodeMirror.fromTextArea(textarea, {
      mode: "htmlmixed",
      theme: "eclipse",
      lineNumbers: true,
      indentUnit: 2,
      tabSize: 2,
      indentWithTabs: false,
      lineWrapping: true,
      viewportMargin: 30,
      extraKeys: {
        "Ctrl-Enter": runCode,
        "Cmd-Enter": runCode,
        "Ctrl-S": function () { downloadHtml(); },
        "Cmd-S": function () { downloadHtml(); }
      }
    });
    editor.on("change", function () { editorStatus.textContent = "Unsaved changes"; });
    editor.on("cursorActivity", updateCursor);
  } else {
    textarea.addEventListener("input", function () { editorStatus.textContent = "Unsaved changes"; });
    textarea.addEventListener("keyup", updateCursor);
  }

  function getCode() { return editor ? editor.getValue() : textarea.value; }
  function setCode(value) { if (editor) editor.setValue(value); else textarea.value = value; }
  function updateCursor() {
    let line = 1, col = 1;
    if (editor) {
      const p = editor.getCursor();
      line = p.line + 1;
      col = p.ch + 1;
    } else {
      const before = textarea.value.slice(0, textarea.selectionStart).split("\n");
      line = before.length;
      col = before[before.length - 1].length + 1;
    }
    cursorStatus.textContent = "Line " + line + ", Col " + col;
  }

  function updatePreviewSize() {
    if (!previewWrap) return;
    const width = Math.round(previewWrap.clientWidth);
    const height = Math.round(previewWrap.clientHeight);
    previewSize.textContent = "Responsive · " + width + " × " + height;
  }

  function runCode() {
    const source = getCode();
    previewFrame.srcdoc = source;
    editorStatus.textContent = "Run complete";
    previewStatus.textContent = "Preview updated";
    updatePreviewSize();
  }

  function downloadHtml() {
    const blob = new Blob([getCode()], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "index.html";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    editorStatus.textContent = "Downloaded index.html";
  }

  document.getElementById("runBtn").addEventListener("click", runCode);
  document.getElementById("resetBtn").addEventListener("click", function () {
    setCode(starter);
    runCode();
    editorStatus.textContent = "Reset complete";
    if (editor) editor.focus();
  });
  document.getElementById("downloadBtn").addEventListener("click", downloadHtml);

  function isMobileLayout() { return window.matchMedia("(max-width: 760px)").matches; }
  function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }

  function applySplit(clientX, clientY) {
    const rect = workspace.getBoundingClientRect();
    if (isMobileLayout()) {
      const top = clamp(clientY - rect.top, 300, Math.max(300, workspace.clientHeight - 360));
      lastMobileTop = top;
      workspace.style.gridTemplateRows = top + "px 8px minmax(360px, 1fr)";
      splitter.setAttribute("aria-orientation", "horizontal");
      splitter.setAttribute("aria-valuenow", String(Math.round(top / Math.max(1, workspace.clientHeight) * 100)));
    } else {
      const left = clamp(clientX - rect.left, 260, Math.max(260, workspace.clientWidth - 288));
      lastDesktopLeft = left;
      workspace.style.gridTemplateColumns = left + "px 8px minmax(280px, 1fr)";
      splitter.setAttribute("aria-orientation", "vertical");
      splitter.setAttribute("aria-valuenow", String(Math.round(left / Math.max(1, workspace.clientWidth) * 100)));
    }
    if (editor) editor.refresh();
    updatePreviewSize();
  }

  splitter.addEventListener("pointerdown", function (event) {
    if (event.button !== 0 && event.pointerType !== "touch") return;
    dragging = true;
    dragAxis = isMobileLayout() ? "y" : "x";
    splitter.classList.add("dragging");
    splitter.setPointerCapture(event.pointerId);
    event.preventDefault();
  });
  splitter.addEventListener("pointermove", function (event) {
    if (!dragging) return;
    applySplit(event.clientX, event.clientY);
  });
  function stopDragging() {
    dragging = false;
    splitter.classList.remove("dragging");
  }
  splitter.addEventListener("pointerup", stopDragging);
  splitter.addEventListener("pointercancel", stopDragging);
  splitter.addEventListener("keydown", function (event) {
    const step = event.shiftKey ? 40 : 16;
    if (isMobileLayout() && (event.key === "ArrowUp" || event.key === "ArrowDown")) {
      event.preventDefault();
      const rect = workspace.getBoundingClientRect();
      const current = lastMobileTop || editorPanel.getBoundingClientRect().height;
      const next = current + (event.key === "ArrowDown" ? step : -step);
      applySplit(rect.left + rect.width / 2, rect.top + next);
    } else if (!isMobileLayout() && (event.key === "ArrowLeft" || event.key === "ArrowRight")) {
      event.preventDefault();
      const rect = workspace.getBoundingClientRect();
      const current = lastDesktopLeft || editorPanel.getBoundingClientRect().width;
      const next = current + (event.key === "ArrowRight" ? step : -step);
      applySplit(rect.left + next, rect.top);
    }
  });

  window.addEventListener("resize", function () {
    if (isMobileLayout()) {
      if (lastMobileTop) applySplit(workspace.getBoundingClientRect().left, workspace.getBoundingClientRect().top + lastMobileTop);
    } else {
      if (lastDesktopLeft) applySplit(workspace.getBoundingClientRect().left + lastDesktopLeft, workspace.getBoundingClientRect().top);
      else splitter.setAttribute("aria-orientation", "vertical");
    }
    if (editor) editor.refresh();
    updatePreviewSize();
  });

  if (window.ResizeObserver) {
    new ResizeObserver(function () { updatePreviewSize(); if (editor) editor.refresh(); }).observe(previewWrap);
  }
  if (editor) editor.refresh();
  updateCursor();
  runCode();
})();
</script>
</body>
</html>
