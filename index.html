<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#243b69 0,#101827 48%,#090d16 100%);color:#f4f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.card{text-align:center;padding:3rem 2rem;max-width:720px}p{color:#b8c7e8;letter-spacing:.22em;text-transform:uppercase;font-size:.78rem;font-weight:700}h1{font-size:clamp(3.5rem,12vw,7rem);line-height:1;margin:1rem 0;letter-spacing:-.07em}h1 span{color:#83e3d0}.sub{font-size:1.1rem;letter-spacing:0;text-transform:none;font-weight:400;line-height:1.7;max-width:34rem;margin:1.5rem auto;color:#c4cde0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#83e3d0;box-shadow:0 0 22px #83e3d0;margin-right:.6rem}
</style>
</head>
<body><main class="card"><p><span class="dot"></span>A tiny page for a big beginning</p><h1>Hello <span>World.</span></h1><div class="sub">The web is full of possibilities. This is the first little step — built with HTML and a little curiosity.</div></main></body>
</html>
